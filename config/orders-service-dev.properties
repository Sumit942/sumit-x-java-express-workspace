eureka.client.fetchRegistry=true
eureka.client.registerWithEureka=true
eureka.client.serviceUrl.defaultZone=http://localhost:9008/eureka
info.app.name=order-service
info.app.description=Order service application
info.app.version=1.0.0
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
server.port=9002
spring.application.name=orders-service
spring.profiles.active=dev
spring.config.import=configserver:http://localhost:9007/
spring.datasource.url=jdbc:mysql://localhost:3306/textile_db
spring.datasource.username=root
spring.datasource.password=12345678
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.kafka.bootstrap-servers=localhost:9012
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
