app.client-service.url=http://localhost:9006
app.notification-service.url=http://localhost:9004
eureka.client.fetchRegistry=true
eureka.client.registerWithEureka=true
eureka.client.serviceUrl.defaultZone=http://localhost:9008/eureka
info.app.name=dispatch-service
info.app.description=Dispatch service application
info.app.version=1.0.0
management.info.env.enabled=true
server.port=9005
spring.application.name=dispatch-service
spring.profiles.active=dev
spring.config.import=configserver:http://localhost:9007/
spring.datasource.url=jdbc:mysql://localhost:3306/textile_db
spring.datasource.username=root
spring.datasource.password=12345678
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
